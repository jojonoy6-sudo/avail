<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ห้องว่าง">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>ห้องว่าง</title>
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --sub:#6e6e73; --line:rgba(0,0,0,.09);
  --blue:#0071e3; --green:#30b455; --red:#ff3b30; --fill:rgba(120,120,128,.12);
  --glass:rgba(245,245,247,.78); --seg-on:#fff; --busy:rgba(120,120,128,.28);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --sub:#98989d; --line:rgba(255,255,255,.12);
  --blue:#2997ff; --green:#30d158; --red:#ff453a; --fill:rgba(120,120,128,.28);
  --glass:rgba(22,22,23,.78); --seg-on:#636366; --busy:rgba(235,235,245,.22);
  --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --sub:#98989d; --line:rgba(255,255,255,.12);
    --blue:#2997ff; --green:#30d158; --red:#ff453a; --fill:rgba(120,120,128,.28);
    --glass:rgba(22,22,23,.78); --seg-on:#636366; --busy:rgba(235,235,245,.22);
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Sukhumvit Set","Noto Sans Thai","Thonburi",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:520px; margin:0 auto; min-height:100dvh; padding:env(safe-area-inset-top) 20px calc(104px + env(safe-area-inset-bottom))}
.view{animation:in .3s ease-out}
@keyframes in{from{opacity:0; transform:translateY(8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

h1.large{font-size:34px; line-height:1.15; font-weight:700; letter-spacing:-.02em; margin:30px 0 4px}
h2.sec{font-size:22px; font-weight:700; letter-spacing:-.01em; margin:38px 0 2px}
h3{font-size:20px; font-weight:700; margin:0}
.sub{color:var(--sub); font-size:15px; margin:0}
.small{font-size:13px; color:var(--sub)}
.eyebrow{font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--sub)}
.stack>*+*{margin-top:12px}
.gap{height:16px}

.card{background:var(--card); border-radius:22px; padding:22px; box-shadow:var(--shadow)}
.hero{margin-top:22px; padding:26px 24px 24px}
.big{font-size:clamp(44px,15vw,64px); line-height:1.05; font-weight:700; letter-spacing:-.03em; margin:6px 0 8px; overflow-wrap:anywhere}
.big.md{font-size:clamp(30px,9vw,40px); letter-spacing:-.02em}
.big.green{color:var(--green)}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-right:7px; vertical-align:middle; position:relative; top:-1px}
.dot.busy{background:var(--busy)}

.rec-main{display:block; width:100%; text-align:left; border:0; background:none; padding:0}
.row-main{border:0; background:none; text-align:left; padding:0; min-width:0}
.rec-actions{margin-top:16px; display:flex; gap:8px}
.chip svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; margin:-2px 6px -2px -2px; vertical-align:middle}
h1.status{font-size:clamp(30px,9vw,38px); line-height:1.12; font-weight:700; letter-spacing:-.025em; margin:6px 0 4px}
.toast{position:fixed; left:16px; right:16px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:40; max-width:488px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 18px; border-radius:16px; background:rgba(40,40,42,.92); color:#fff; font-size:15px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); opacity:0; transform:translateY(12px); pointer-events:none; transition:opacity .25s,transform .25s}
.toast.on{opacity:1; transform:none; pointer-events:auto}
.toast button{border:0; background:none; color:#4db3ff; font-weight:600; font-size:15px; padding:0}
.rec .room-num{font-size:clamp(60px,21vw,88px); line-height:1.02; font-weight:700; letter-spacing:-.04em; margin:2px 0 4px}
.rec .room-sub{font-size:17px; color:var(--sub)}
.rec .until{margin-top:14px; font-weight:600; font-size:15px}
.rec .why{margin-top:4px; color:var(--sub); font-size:14px}

.group{background:var(--card); border-radius:18px; overflow:hidden; box-shadow:var(--shadow)}
.group+.group,.group+.stack{margin-top:12px}
.row{display:flex; align-items:center; gap:12px; width:100%; padding:14px 18px; border:0; background:none; text-align:left; border-bottom:.5px solid var(--line); min-height:56px}
.row:last-child{border-bottom:0}
.row .grow{flex:1; min-width:0}
.row .t{font-size:19px; font-weight:600; letter-spacing:-.01em}
.row .t.n{font-size:17px; font-weight:500}
.row .s{font-size:14px; color:var(--sub)}
.row .end{color:var(--sub); font-size:15px; text-align:right; white-space:nowrap}
.chev{width:16px; height:16px; stroke:var(--sub); opacity:.6; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}
.link{border:0; background:none; color:var(--blue); font-size:17px; padding:14px 2px 0}
.empty{padding:28px 22px; text-align:center; color:var(--sub)}

.seg{display:flex; gap:2px; background:var(--fill); border-radius:10px; padding:2px; margin:18px 0 6px}
.seg button{flex:1; border:0; background:none; padding:8px 0; border-radius:8px; font-size:15px; transition:background .2s}
.seg button.on{background:var(--seg-on); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.14)}

.seg.seg-sm{margin:0; flex:none}
.seg-sm button{flex:none; padding:4px 11px; font-size:13px}
.tt{display:grid; grid-template-columns:36px repeat(5,minmax(0,1fr)); gap:4px; margin-top:16px}
.tt .th{text-align:center; font-size:13px; font-weight:600; color:var(--sub); padding:2px 0 4px}
.tt .th.cur{color:var(--blue)}
.tp{display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1}
.tp b{font-size:16px; font-weight:600}
.tp small{font-size:9.5px; color:var(--sub)}
.tp.cur b{color:var(--blue)}
.tc{min-height:54px; border:0; border-radius:11px; padding:4px 3px; background:var(--fill); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-align:center; overflow:hidden; transition:transform .12s}
.tc:active{transform:scale(.95)}
.tc.busy{background:color-mix(in srgb,var(--blue) 15%,var(--card))}
.tc b{font-size:12px; font-weight:600; line-height:1.15; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word}
.tc small{font-size:10px; color:var(--sub); line-height:1.1}
.tc.ov{outline:1.5px dashed var(--blue); outline-offset:-2px}
.pills{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin:12px 0}
.pill{border:0; background:var(--card); border-radius:14px; padding:9px 0 7px; display:flex; flex-direction:column; align-items:center; gap:0; line-height:1.15; box-shadow:var(--shadow); transition:background .2s,color .2s}
.pill b{font-size:20px; font-weight:600}
.pill small{font-size:11px; color:var(--sub)}
.pill.mid{background:color-mix(in srgb,var(--blue) 16%,var(--card))}
.pill.on{background:var(--blue); color:#fff}
.pill.on small{color:rgba(255,255,255,.8)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px}
.chip{border:0; background:var(--fill); border-radius:980px; padding:7px 14px; font-size:14px}
.chip.on{background:var(--blue); color:#fff}
.gh{font-size:13px; font-weight:600; color:var(--sub); margin:22px 4px 8px; letter-spacing:.02em}

.pn{width:40px; flex:none; text-align:center}
.pn b{display:block; font-size:19px; font-weight:600; line-height:1.1}
.pn small{font-size:10.5px; color:var(--sub)}

.ibtn{border:0; background:none; padding:6px; border-radius:10px; color:var(--sub); display:inline-flex}
.ibtn svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.ibtn.on{color:#ff9f0a}
.ibtn.on.hd{color:var(--red)}
.ibtn.on svg.star{fill:currentColor}

.switch{position:relative; width:51px; height:31px; flex:none}
.switch input{position:absolute; inset:0; opacity:0; margin:0; width:100%; height:100%; z-index:1}
.switch span{position:absolute; inset:0; border-radius:16px; background:var(--fill); transition:background .25s}
.switch span::after{content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.25); transition:transform .25s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}

.btn{border:0; border-radius:980px; padding:12px 24px; font-weight:500; background:var(--blue); color:#fff}
.btn.ghost{background:var(--fill); color:var(--blue)}
.btn.block{width:100%}
.lbl{flex:none; white-space:nowrap}
.field{flex:1; min-width:0; border:0; background:none; padding:0; outline:0; text-align:right}
select.field{appearance:none; -webkit-appearance:none}
.btns{display:flex; gap:10px; margin-top:18px}
.btns .btn{flex:1}

.tabbar{position:fixed; inset:auto 0 0 0; z-index:20; background:var(--glass); backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px); border-top:.5px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:520px; margin:0 auto; display:flex}
.tab{flex:1; border:0; background:none; color:var(--sub); padding:9px 0 7px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:500}
.tab svg{width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.tab.on{color:var(--blue)}

.scrim{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .3s}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:31; max-width:520px; margin:0 auto; max-height:90dvh; overflow:auto; background:var(--bg); border-radius:26px 26px 0 0; padding:10px 20px calc(26px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .38s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:none}
.grab{width:38px; height:5px; border-radius:3px; background:var(--fill); margin:0 auto 18px}
.sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.sheet-head .acts{display:flex; gap:2px; margin-top:-4px}

.wk{display:grid; grid-template-columns:22px repeat(10,1fr); gap:3px; margin-top:14px}
.wk .h{font-size:10px; color:var(--sub); text-align:center; line-height:18px}
.wk .d{font-size:12px; font-weight:600; display:flex; align-items:center}
.wk .d.cur{color:var(--blue)}
.wk i{display:block; height:28px; border-radius:7px; background:var(--busy); border:0}
.wk i.h{height:18px; border-radius:0; background:none}
.wk i.free{background:color-mix(in srgb,var(--green) 18%,transparent)}
.wk i.hit{outline:2px solid var(--blue); outline-offset:1px}
.wk i.sel{outline:2px solid var(--text); outline-offset:1px}
.info{min-height:44px; margin-top:12px; font-size:14px; color:var(--sub)}
.legend{display:flex; gap:14px; margin-top:6px; font-size:12px; color:var(--sub)}
.legend s{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; background:var(--busy); text-decoration:none}
.legend s.f{background:color-mix(in srgb,var(--green) 30%,transparent)}
.hide{display:none!important}
</style>
</head>

/* ---------- เวลาไทย ---------- */
const TZ_PARTS = new Intl.DateTimeFormat("en-GB", {
  timeZone: "Asia/Bangkok", weekday: "short", year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", hourCycle: "h23",
});
const TZ_LABEL = new Intl.DateTimeFormat("th-TH", {timeZone: "Asia/Bangkok", weekday: "long", day: "numeric", month: "short"});
function bkk() {
  const q = new URLSearchParams(location.search).get("now");   // ?now=2026-11-09T09:30 ไว้ทดสอบ
  const d = q ? new Date(/(Z|[+-]\d\d:?\d\d)$/i.test(q) ? q : q + "+07:00") : new Date();
  const p = Object.fromEntries(TZ_PARTS.formatToParts(d).map(x => [x.type, x.value]));
  const day = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(p.weekday);
  return {day, min: +p.hour * 60 + +p.minute, date: `${p.year}-${p.month}-${p.day}`, label: TZ_LABEL.format(d), fixed: !!q};
}
const fmtDur = m => m < 60 ? `${m} นาที` : `${Math.floor(m / 60)} ชม.` + (m % 60 ? ` ${m % 60} นาที` : "");

function load() {
  const def = () => ({my: clone(DATA.timetable.busy), fav: [], hide: [], floor: null, smart: false, rest: [], hist: {}, skip: null, ovr: null, theme: "auto", lowFirst: true, chain: true, chainMax: 1, chainMin: 1, chainStep: 3});
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.my) return Object.assign(def(), s);
  } catch (e) {}
  return def();
}
let S = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- ธีม: auto = ตามเครื่อง · light · dark ---------- */
function applyTheme() {
  const root = document.documentElement;
  if (S.theme === "light" || S.theme === "dark") root.dataset.theme = S.theme; else delete root.dataset.theme;
  const bg = getComputedStyle(root).getPropertyValue("--bg").trim();
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta && bg) meta.content = bg;
}
applyTheme();
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S.theme === "auto") applyTheme(); });

const roomSub = r => {
  const extra = isNum(r) ? r.name : (r.name.split("·")[1] || "").trim();
  return [extra, where(r)].filter(Boolean).join(" · ");
};
const slotRoom = it => it && it.room ? roomTitle(R[it.room]) : (it && it.place) || "";

/* ---------- ตารางของฉัน: ช่วงว่าง ---------- */
const base = (d, p) => S.my[d] && S.my[d][p];       // ตารางหลัก
function ovrToday(d) {                              // ค่าที่แก้เฉพาะวันนี้ (หมดอายุเมื่อเปลี่ยนวัน)
  const t = bkk();
  return S.ovr && S.ovr.date === t.date && t.day === d ? S.ovr.p : null;
}
function mine(d, p) {                               // ตารางที่ใช้จริง = ตารางหลัก + แก้เฉพาะวันนี้
  const o = ovrToday(d);
  if (o && o[p] !== undefined) return o[p] ? {title: "ไม่ว่าง (เฉพาะวันนี้)", today: true} : null;
  return base(d, p);
}
const isRest = p => S.rest.includes(p);
const skippedToday = id => !!(S.skip && S.skip.date === bkk().date && S.skip.ids.includes(id));
function freeSpans(day, from = 1) {
  const out = []; let s = null;
  for (let p = from; p <= MAX_P; p++) {
    const free = !mine(day, p) && !isRest(p);
    if (free && s === null) s = p;
    if (!free && s !== null) { out.push([s, p - 1]); s = null; }
  }
  if (s !== null) out.push([s, MAX_P]);
  return out;
}

/* ---------- ระบบแนะนำห้อง ---------- */
function closeness(a, b) {                     // -1 = ห้องเดียวกัน, 0 = ชั้นเดียวกัน, 1.. = ห่างกี่ชั้น, 9 = คนละตึก
  if (!a || !b) return null;
  if (a.id === b.id) return -1;
  return a.building === b.building ? Math.abs(a.floor - b.floor) : 9;
}
function recommend(day, s, e) {
  const prev = mine(day, s - 1), next = mine(day, e + 1);
  const pr = prev && prev.room && R[prev.room], nr = next && next.room && R[next.room];
  const len = e - s + 1, out = [];
  for (const r of ROOMS) {
    if (S.hide.includes(r.id) || skippedToday(r.id)) continue;
    let k = 0;
    while (s + k <= e && !(r.busy[day] && r.busy[day][s + k])) k++;
    if (!k) continue;
    let score = k * 10; const why = [];
    why.push(k === len ? (len === 1 ? "ว่างตลอดคาบ" : `ว่างครบ ${len} คาบ`) : `ว่าง ${k} จาก ${len} คาบ`);
    if (k === len) score += 15;
    const dn = closeness(r, nr), dp = closeness(r, pr);
    if (dn === -1) { score += 10; why.push("ห้องเดียวกับคาบถัดไป"); }
    else if (dn === 0) { score += 8; why.push(`ชั้นเดียวกับคาบถัดไป (${roomTitle(nr)})`); }
    else if (dn === 1) { score += 4; why.push("ชั้นติดกับคาบถัดไป"); }
    if (dp === 0) { score += 4; why.push(`ใกล้ห้องคาบก่อน (${roomTitle(pr)})`); }
    if (S.fav.includes(r.id)) { score += 12; why.push("ห้องโปรด"); }
    if (S.floor && r.floor === S.floor && r.building === "ตึก 3") { score += 6; why.push(`ชั้น ${S.floor} ที่ชอบ`); }
    if (S.smart && r.id.startsWith("Smart")) { score += 5; why.push("ห้อง Smart"); }
    const bad = (S.hist[r.id] && S.hist[r.id][day + "-" + s]) || 0;   // เคยกด "ใช้ไม่ได้" ช่วงเวลานี้กี่ครั้ง
    if (bad) { score -= Math.min(bad, 3) * 8; why.push(`เคยใช้ไม่ได้ช่วงนี้ ${bad} ครั้ง`); }
    out.push({r, k, len, score, why, until: PER[s + k - 1].end});
  }
  const byId = (a, b) => (a.r.id < b.r.id ? -1 : 1);
  if (!S.lowFirst) return out.sort((a, b) => b.score - a.score || byId(a, b));
  // ชั้นล่างก่อน: ว่างได้นานกว่าขึ้นก่อน -> ชั้นที่ชอบ -> ชั้นล่าง (ห้องนอกตึกอยู่ท้าย) -> คะแนนอื่น ๆ
  const liked = x => (S.floor && x.r.building === "ตึก 3" && x.r.floor === S.floor ? 0 : 1);
  const lvl = x => (x.r.building === "ตึก 3" ? x.r.floor : 9);
  return out.sort((a, b) => b.k - a.k || liked(a) - liked(b) || lvl(a) - lvl(b) || b.score - a.score || byId(a, b));
}

/* ---------- ย้ายห้องต่อเนื่อง: ห้อง A ว่างคาบ 1-3 + ห้อง B ว่างคาบ 4-5 = ได้ที่นั่งตลอดคาบ 1-4 ---------- */
const STEPS = [[0, "ชั้นเดียวกัน"], [1, "ห่างไม่เกิน 1 ชั้น"], [3, "ตึกเดียวกัน"], [9, "ไม่จำกัด"]];
const lvlOf = r => (r.building === "ตึก 3" ? r.floor : 9);
function comps(n, k, min) {                    // แบ่ง n คาบเป็น k ท่อน ท่อนละอย่างน้อย min เรียงให้ท่อนแรกยาวสุดก่อน (ย้ายช้าที่สุดก่อน)
  if (k === 1) return n >= min ? [[n]] : [];
  const out = [];
  for (let f = n - (k - 1) * min; f >= min; f--) for (const rest of comps(n - f, k - 1, min)) out.push([f, ...rest]);
  return out;
}
function chains(day, s, e) {
  const len = e - s + 1;
  if (!S.chain || len < 2 * S.chainMin) return [];
  const usable = ROOMS.filter(r => !S.hide.includes(r.id) && !skippedToday(r.id));
  const freeOn = (r, a, b) => { for (let p = a; p <= b; p++) if (r.busy[day] && r.busy[day][p]) return false; return true; };
  const cache = {}, cand = (a, b) => cache[a + "-" + b] || (cache[a + "-" + b] = usable.filter(r => freeOn(r, a, b)));
  const prev = mine(day, s - 1), next = mine(day, e + 1);
  const pr = prev && prev.room && R[prev.room], nr = next && next.room && R[next.room];
  const seen = new Set(), out = [];
  for (let k = 2; k <= S.chainMax + 1; k++) {
    for (const lens of comps(len, k, S.chainMin)) {
      let at = s;
      const ranges = lens.map(n => { const g = [at, at + n - 1]; at += n; return g; });
      const walk = (i, acc) => {
        if (out.length >= 4000) return;
        if (i === ranges.length) {
          const key = acc.map(r => r.id).join(">");
          if (seen.has(key)) return;               // ลำดับห้องเดิม เก็บแบบที่ย้ายช้าสุดแบบเดียว
          seen.add(key);
          let score = 0;
          acc.forEach((r, j) => {
            if (S.fav.includes(r.id)) score += 12;
            if (S.floor && r.floor === S.floor && r.building === "ตึก 3") score += 6;
            if (S.smart && r.id.startsWith("Smart")) score += 5;
            const bad = (S.hist[r.id] && S.hist[r.id][day + "-" + ranges[j][0]]) || 0;
            score -= Math.min(bad, 3) * 8;
            if (j) { const c = closeness(acc[j - 1], r); score += c === 0 ? 4 : c === 1 ? 2 : 0; }
          });
          const dn = closeness(acc[acc.length - 1], nr);
          score += dn === -1 ? 10 : dn === 0 ? 8 : dn === 1 ? 4 : 0;
          if (closeness(acc[0], pr) === 0) score += 4;
          out.push({key, moves: k - 1, score, lvl: Math.max(...acc.map(lvlOf)), lvlSum: acc.reduce((n, r) => n + lvlOf(r), 0),
                    near: dn !== null && dn <= 0, segs: acc.map((r, j) => ({r, a: ranges[j][0], b: ranges[j][1]}))});
          return;
        }
        const [a, b] = ranges[i];
        for (const r of cand(a, b)) {
          const q = acc[i - 1];
          if (acc.some(x => x.id === r.id)) continue;
          if (q) {
            if (closeness(q, r) > S.chainStep) continue;
            if (freeOn(q, a, b) || freeOn(r, ranges[i - 1][0], ranges[i - 1][1])) continue;   // ห้องเดียวอยู่ต่อได้ ไม่ต้องย้าย
          }
          acc.push(r); walk(i + 1, acc); acc.pop();
        }
      };
      walk(0, []);
    }
  }
  return out.sort((x, y) => x.moves - y.moves || (S.lowFirst ? x.lvl - y.lvl || x.lvlSum - y.lvlSum : 0) || y.score - x.score || (x.key < y.key ? -1 : 1));
}
const moveText = (a, b) => {
  if (a.building !== b.building) return "ต่างตึก";
  const d = b.floor - a.floor;
  return d === 0 ? "ชั้นเดียวกัน" : d < 0 ? `ลง ${-d} ชั้น` : `ขึ้น ${d} ชั้น`;
};
function chainCard(c, day) {
  return `<div class="group">` + c.segs.map((g, i) => {
    const sub = [where(g.r), i ? moveText(c.segs[i - 1].r, g.r) : "", i === c.segs.length - 1 && c.near ? "ใกล้คาบถัดไป" : "", S.fav.includes(g.r.id) ? "ห้องโปรด" : ""].filter(Boolean).join(" · ");
    return `<button class="row" data-a="room" data-id="${g.r.id}" data-day="${day}" data-s="${g.a}" data-e="${g.b}">
      <div class="pn"><b>${g.a === g.b ? g.a : g.a + "–" + g.b}</b><small>${fmt(PER[g.a].start)}</small></div>
      <div class="grow"><div class="t">${esc(roomTitle(g.r))}</div><div class="s">${esc(sub)}</div></div>
      <span class="end">ถึง ${fmt(PER[g.b].end)}</span>${CHEV}</button>`;
  }).join("") + `</div>`;
}

/* ---------- สถานะ "ตอนนี้" ---------- */
function nextSpan(fromDay, t) {                 // ช่วงว่างแรกของวันเรียนถัดไป
  let d = fromDay;
  for (let i = 0; i < 7; i++) {
    d = (d + 1) % 7;
    if (d > 4) continue;
    const sp = freeSpans(d)[0];
    if (sp) return {day: d, s: sp[0], e: sp[1], tomorrow: d === (t.day + 1) % 7};
  }
  return null;
}
function nowState(t) {
  const {day, min} = t;
  if (day > 4 || min >= PER[MAX_P].end) return {kind: "closed", next: nextSpan(day > 4 ? 4 : day, t)};
  let p = 1, inClass = true;
  if (min < PER[1].start) inClass = false;
  else for (let i = 1; i <= MAX_P; i++) if (min < PER[i].end) { p = i; break; }
  const item = mine(day, p) || (isRest(p) ? {title: "ช่วงพัก", rest: true} : null);
  if (item) {
    const sp = freeSpans(day, p + 1)[0];
    return {kind: "busy", p, item, left: PER[p].end - min,
            next: sp ? {day, s: sp[0], e: sp[1], today: true} : nextSpan(day, t)};
  }
  const sp = freeSpans(day, p)[0];
  return {kind: "free", p, inClass, span: {day, s: p, e: sp[1]}};
}

/* ---------- view: ตอนนี้ ---------- */
const spanText = (a, b) => b > a ? `คาบ ${a}–${b}` : `คาบ ${a}`;
const timeText = (a, b) => `${fmt(PER[a].start)}–${fmt(PER[b].end)} น.`;

const dayWord = n => n.tomorrow ? "พรุ่งนี้" : "วัน" + DAY_NAMES[n.day];
const nextTitle = n => `${dayWord(n)} · ${spanText(n.s, n.e)} · ${timeText(n.s, n.e)}`;
const ctxAttr = spec => `data-day="${spec.day}" data-s="${spec.s}" data-e="${spec.e}"`;

function recsHtml(spec, title) {
  if (!spec) return `<div class="card empty" style="margin-top:26px">ไม่มีคาบว่างในตารางของคุณ</div>`;
  const list = recommend(spec.day, spec.s, spec.e);
  const top = list.slice(0, 3), len = spec.e - spec.s + 1;
  const ch = chains(spec.day, spec.s, spec.e);
  const noFull = !list.length || list[0].k < len;          // ไม่มีห้องเดียวที่ว่างครบทั้งช่วง -> เสนอแบบย้ายห้องก่อน
  const chainLink = (txt) => `<button class="link" data-a="seeAll" data-mode="chain" ${ctxAttr(spec)}>${txt}</button>`;
  let h = `<p class="eyebrow" style="margin:26px 4px 10px">${esc(title)}</p>`;
  if (noFull && ch.length) {
    h += `<p class="small" style="margin:0 4px 10px">ไม่มีห้องเดียวที่ว่างตลอดช่วง ลองย้ายห้องแบบนี้</p>`
      + ch.slice(0, 2).map(c => chainCard(c, spec.day)).join("") + chainLink(`ดูแบบย้ายห้องทั้งหมด (${ch.length})`);
    if (top.length) h += `<p class="eyebrow" style="margin:26px 4px 10px">หรืออยู่ห้องเดียว (ว่างบางส่วน)</p>`;
  }
  if (!top.length) {
    if (!(noFull && ch.length)) h += `<div class="card empty">ไม่มีห้องไหนว่างในช่วงนี้</div>`;
  } else {
    const m = top[0], ctx = ctxAttr(spec);
    h += `<div class="card rec">
      <button class="rec-main" data-a="room" data-id="${m.r.id}" ${ctx}>
        <div class="room-num">${esc(roomTitle(m.r))}</div>
        <div class="room-sub">${esc(roomSub(m.r))}</div>
        <div class="until"><i class="dot"></i>ว่างถึง ${fmt(m.until)} น.</div>
        <div class="why">${esc(m.why.join(" · "))}</div>
      </button>
      <div class="rec-actions"><button class="chip" data-a="skip" data-id="${m.r.id}" ${ctx}>${svg("x")}ห้องนี้ใช้ไม่ได้</button></div></div>`;
    if (top.length > 1) {
      h += `<div class="group" style="margin-top:12px">` + top.slice(1).map(x => `
        <div class="row">
          <button class="grow row-main" data-a="room" data-id="${x.r.id}" ${ctx}><div class="t">${esc(roomTitle(x.r))}</div><div class="s">${esc(x.why.join(" · "))}</div></button>
          <div class="end">ถึง ${fmt(x.until)}</div>
          <button class="ibtn" data-a="skip" data-id="${x.r.id}" ${ctx} aria-label="ห้องนี้ใช้ไม่ได้">${svg("x")}</button>
        </div>`).join("") + `</div>`;
    }
  }
  h += `<button class="link" data-a="seeAll" ${ctxAttr(spec)}>ดูห้องว่างทั้งหมด (${list.length} ห้อง)</button>`;
  if (!noFull && ch.length) h += `<br>` + chainLink(`ดูแบบย้ายห้องต่อเนื่อง (${ch.length} แบบ)`);
  return h;
}

function nowView() {
  const t = bkk(), st = nowState(t);
  let head, sub = "", extra = "", spec = null, title = "";

  if (st.kind === "busy") {
    const it = st.item, started = t.min >= PER[st.p].start;
    const detail = it.rest ? "ช่วงพัก" : [it.title, slotRoom(it)].filter(Boolean).join(" · ");
    const nextAt = st.next && st.next.today ? ` · ว่างต่อ ${fmt(PER[st.next.s].start)} น.` : "";
    head = it.rest ? `พักอีก ${fmtDur(st.left)}` : started ? `เรียนอีก ${fmtDur(st.left)}` : `เริ่มเรียน ${fmt(PER[st.p].start)} น.`;
    sub = detail + nextAt;
    if (it.today) extra = `<button class="link" data-a="todayClear" data-p="${st.p}">ยกเลิกการแก้เฉพาะวันนี้</button>`;
    else if (!it.rest && started) extra = `<button class="link" data-a="todaySet" data-p="${st.p}" data-v="0">คาบนี้ไม่มีเรียนวันนี้ (ครูไม่มา?)</button>`;
    if (st.next) {
      spec = st.next;
      title = "คาบว่างถัดไป · " + (st.next.today ? `${spanText(st.next.s, st.next.e)} · ${timeText(st.next.s, st.next.e)}` : nextTitle(st.next));
    }
  } else if (st.kind === "free") {
    const sp = st.span, end = PER[sp.e].end;
    head = st.inClass ? `<i class="dot"></i>ว่างอีก ${fmtDur(end - t.min)}` : "ยังไม่เริ่มคาบแรก";
    sub = `ถึง ${fmt(end)} น. · ${spanText(sp.s, sp.e)}`;
    if (ovrToday(t.day) && ovrToday(t.day)[st.p] !== undefined) extra = `<button class="link" data-a="todayClear" data-p="${st.p}">ยกเลิกการแก้เฉพาะวันนี้</button>`;
    spec = sp;
    title = st.inClass ? `ตอนนี้ – ${fmt(end)} น.` : `${spanText(sp.s, sp.e)} · ${timeText(sp.s, sp.e)}`;
  } else {
    const n = st.next;
    head = t.day > 4 ? "วันหยุด" : "เลิกเรียนแล้ว";
    sub = n ? `คาบว่างแรก ${dayWord(n)} · ${spanText(n.s, n.e)} · ${timeText(n.s, n.e)}` : "ตารางของคุณแน่นทุกคาบ";
    if (n) { spec = n; title = nextTitle(n); }
  }
  const safeHead = st.kind === "free" && st.inClass ? head : esc(head);
  return `<p class="eyebrow" style="margin:30px 4px 0">${esc(t.label)} · ${fmt(t.min)} น.</p>
    <h1 class="status">${safeHead}</h1><p class="sub">${esc(sub)}</p>${extra}${recsHtml(spec, title)}`;
}

/* ---------- view: ค้นหา ---------- */
const Q = {day: 0, a: 1, b: 1, mode: "one", more: false};
function initQ() {                              // ค่าเริ่มต้น = คาบที่ว่างตอนนี้ (หรือคาบว่างถัดไป) คาบเดียว
  const st = nowState(bkk());
  const sp = st.kind === "free" ? st.span : st.next;
  if (sp) { Q.day = sp.day; Q.a = Q.b = sp.s; }
}
initQ();
const freeUntil = (r, day, p) => {              // ห้องนี้ว่างต่อเนื่องจากคาบ p ถึงกี่โมง
  let k = 0;
  while (p + k <= MAX_P && !(r.busy[day] && r.busy[day][p + k])) k++;
  return PER[p + k - 1].end;
};

function searchView() {
  const spans = freeSpans(Q.day);
  const ch = chains(Q.day, Q.a, Q.b), canChain = S.chain && Q.b > Q.a;
  const mode = canChain ? Q.mode : "one";
  const res = ROOMS.filter(r => !S.hide.includes(r.id) && Array.from({length: Q.b - Q.a + 1}, (_, i) => Q.a + i).every(p => !(r.busy[Q.day] && r.busy[Q.day][p])));
  const groups = [];
  for (const r of res) {
    const key = where(r);
    let g = groups.find(x => x.key === key);
    if (!g) groups.push(g = {key, rooms: []});
    g.rooms.push(r);
  }
  const pills = Array.from({length: MAX_P}, (_, i) => i + 1).map(p => {
    const cls = p >= Q.a && p <= Q.b ? (p === Q.a || p === Q.b ? "on" : "mid") : "";
    return `<button class="pill ${cls}" data-a="per" data-p="${p}"><b>${p}</b><small>${fmt(PER[p].start)}</small></button>`;
  }).join("");
  const chips = spans.length ? spans.map(([a, b]) => `<button class="chip ${a === Q.a && b === Q.b ? "on" : ""}" data-a="span" data-s="${a}" data-e="${b}">${spanText(a, b)}</button>`).join("") : `<span class="small">ไม่มีคาบว่างในวันนี้</span>`;
  const modeSeg = canChain ? `<div class="seg" style="margin-top:22px">
      <button class="${mode === "one" ? "on" : ""}" data-a="mode" data-v="one">ห้องเดียว · ${res.length}</button>
      <button class="${mode === "chain" ? "on" : ""}" data-a="mode" data-v="chain">ย้ายห้อง · ${ch.length}</button></div>` : "";
  const single = `<h2 class="sec" style="margin-top:${canChain ? 16 : 30}px">${res.length} ห้องว่าง</h2>
    <p class="sub">${spanText(Q.a, Q.b)} · ${timeText(Q.a, Q.b)}</p>
    ${res.length ? groups.map(g => `<div class="gh">${esc(g.key)}</div><div class="group">${g.rooms.map(r => `
      <button class="row" style="${skippedToday(r.id) ? "opacity:.5" : ""}" data-a="room" data-id="${r.id}" data-day="${Q.day}" data-s="${Q.a}" data-e="${Q.b}">
        <div class="grow"><div class="t">${esc(roomTitle(r))}</div><div class="s">${esc(roomSub(r))}</div></div>
        <span class="end">${skippedToday(r.id) ? "ข้ามวันนี้" : "ว่างถึง " + fmt(freeUntil(r, Q.day, Q.a))}</span>${S.fav.includes(r.id) ? `<span class="ibtn on">${svg("star", "star")}</span>` : ""}${CHEV}</button>`).join("")}</div>`).join("")
      : `<div class="card empty" style="margin-top:14px">ไม่มีห้องเดียวที่ว่างตลอดช่วงนี้${ch.length ? `<br><button class="link" data-a="mode" data-v="chain">ดูแบบย้ายห้อง (${ch.length} แบบ)</button>` : "<br>ลองเลือกช่วงที่สั้นลง"}</div>`}`;
  const shown = Q.more ? ch.slice(0, 30) : ch.slice(0, 6);
  const rule = `ย้ายไม่เกิน ${S.chainMax} ครั้ง · อยู่ห้องละอย่างน้อย ${S.chainMin} คาบ · ${STEPS.find(x => x[0] === S.chainStep)[1]}`;
  const chained = `<h2 class="sec" style="margin-top:16px">${ch.length} แบบย้ายห้อง</h2>
    <p class="sub">${spanText(Q.a, Q.b)} · ${timeText(Q.a, Q.b)}</p><p class="small" style="margin:2px 0 14px">${esc(rule)}</p>
    ${ch.length ? shown.map(c => chainCard(c, Q.day)).join("") + (ch.length > shown.length ? `<button class="link" data-a="chainMore">ดูเพิ่ม (อีก ${Math.min(ch.length, 30) - shown.length} แบบ)</button>` : "")
      : `<div class="card empty">ไม่มีแบบย้ายห้องที่ตรงเงื่อนไข<br><button class="link" data-a="tab" data-t="settings">ปรับเงื่อนไขในตั้งค่า</button></div>`}`;
  return `<h1 class="large">ห้องว่าง</h1><p class="sub">ห้องที่ว่างตลอดช่วงที่เลือก</p>
    <div class="seg" id="qday">${DAY_SHORT.map((d, i) => `<button class="${i === Q.day ? "on" : ""}" data-a="qday" data-d="${i}">${d}</button>`).join("")}</div>
    <div class="pills">${pills}</div>
    <p class="small">แตะคาบเริ่มต้น แล้วแตะคาบสุดท้ายเพื่อเลือกช่วง</p>
    <div class="gh">คาบว่างของฉัน</div><div class="chips">${chips}</div>
    ${modeSeg}${mode === "chain" ? chained : single}`;
}

/* ---------- view: ตารางของฉัน (ตารางจริง: แถว=คาบ คอลัมน์=วัน แตะช่องเพื่อแก้) ---------- */
function mineView() {
  const t = bkk(), st = nowState(t);
  const curP = st.kind === "closed" ? -1 : st.p;
  let grid = '<i></i>' + DAY_SHORT.map((d, i) => `<b class="th ${i === t.day ? "cur" : ""}">${d}</b>`).join("");
  for (let p = 0; p <= MAX_P; p++) {
    const per = DATA.periods[p].split("-")[0].replace(".", ":");
    grid += `<div class="tp ${p === curP ? "cur" : ""}"><b>${p}</b><small>${per}</small></div>`;
    for (let d = 0; d < 5; d++) {
      const it = mine(d, p), o = ovrToday(d), ov = !!(o && o[p] !== undefined);
      const txt = it ? `<b>${esc(it.today ? "ไม่ว่าง" : it.title)}</b><small>${esc(slotRoom(it))}</small>`
        : ov ? "<small>ว่างวันนี้</small>" : isRest(p) ? "<small>พัก</small>" : "";
      grid += `<button class="tc ${it ? "busy" : ""} ${ov ? "ov" : ""}" data-a="edit" data-d="${d}" data-p="${p}" aria-label="วัน${DAY_NAMES[d]} คาบ ${p}">${txt}</button>`;
    }
  }
  return `<h1 class="large">ตารางของฉัน</h1><p class="sub">${esc(DATA.timetable.name)} · ภาคเรียน ${esc(DATA.term)} · แตะช่องเพื่อแก้</p>
    <div class="tt">${grid}</div>
    <p class="small" style="margin:14px 4px 0">ช่องเส้นประ = แก้เฉพาะวันนี้ · ช่องสีเทา = ว่าง</p>
    <button class="link" data-a="resetMy">คืนค่าตารางตั้งต้น (${esc(DATA.timetable.name)})</button>`;
}

/* ---------- view: ตั้งค่า ---------- */

      <span class="switch"><input type="checkbox" data-c="smart" ${S.smart ? "checked" : ""}><span></span></span></label></div>

    <div class="chips">${Array.from({length: MAX_P}, (_, i) => i + 1).map(p => `<button class="chip ${S.rest.includes(p) ? "on" : ""}" data-a="rest" data-p="${p}">${p}</button>`).join("")}</div>
    <p class="small" style="margin:6px 4px 0">เลือกคาบที่ไม่อยากให้แนะนำห้อง เช่น พักเที่ยง คาบนั้นจะถือเป็นช่วงพักและข้ามไป</p>

      <span class="switch"><input type="checkbox" data-c="chain" ${S.chain ? "checked" : ""}><span></span></span></label></div>
    <div class="${S.chain ? "" : "hide"}">

      <div class="gh">อยู่ห้องละอย่างน้อย</div><div class="chips">${[1, 2, 3].map(n => `<button class="chip ${S.chainMin === n ? "on" : ""}" data-a="chainMin" data-n="${n}">${n} คาบ</button>`).join("")}</div>
      <div class="gh">ห้องที่ย้ายไปต้องอยู่</div><div class="chips">${STEPS.map(([n, name]) => `<button class="chip ${S.chainStep === n ? "on" : ""}" data-a="chainStep" data-n="${n}">${name}</button>`).join("")}</div>
      <p class="small" style="margin:6px 4px 0">เทียบกับห้องก่อนหน้าที่ต้องย้ายออก ยิ่งเข้มยิ่งเดินน้อย</p>

      <div class="seg seg-sm">${themes.map(([v, name]) => `<button class="${S.theme === v ? "on" : ""}" data-a="theme" data-v="${v}">${name}</button>`).join("")}</div></div></div>
    <p class="small" style="margin:24px 4px 0">ข้อมูลห้อง ภาคเรียน ${esc(DATA.term)} จากตารางการใช้ห้องเรียน (23-10-69) · ค่าที่ตั้งเก็บไว้ในเครื่องนี้เท่านั้น</p>`;
}

/* ---------- ชีต (bottom sheet) ---------- */
let sheetFn = null, sheetInfo = null;
function openSheet(fn) { sheetFn = fn; renderSheet(); $("#scrim").classList.add("on"); requestAnimationFrame(() => { if (sheetFn) $("#sheet").classList.add("on"); }); }
function closeSheet() { sheetFn = null; sheetInfo = null; $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }
function renderSheet() { if (sheetFn) $("#sheet").innerHTML = `<div class="grab"></div>` + sheetFn(); }

function roomSheet(id, ctx) {
  return () => {
    const r = R[id], today = bkk().day;
    const fav = S.fav.includes(id), hid = S.hide.includes(id);
    const hdr = '<i class="h"></i>' + Array.from({length: MAX_P + 1}, (_, p) => `<i class="h">${p}</i>`).join("");
    let grid = "";
    for (let d = 0; d < 5; d++) {
      grid += `<span class="d ${d === today ? "cur" : ""}">${DAY_SHORT[d]}</span>`;
      for (let p = 0; p <= MAX_P; p++) {
        const busy = r.busy[d] && r.busy[d][p];
        const hit = ctx && ctx.day === d && p >= ctx.s && p <= ctx.e;
        const sel = sheetInfo && sheetInfo.d === d && sheetInfo.p === p;
        grid += `<i class="${busy ? "" : "free"} ${hit ? "hit" : ""} ${sel ? "sel" : ""}" data-a="cell" data-d="${d}" data-p="${p}"></i>`;
      }
    }
    let info = "แตะช่องเพื่อดูว่าใครใช้";
    if (sheetInfo) {
      const c = r.busy[sheetInfo.d] && r.busy[sheetInfo.d][sheetInfo.p];
      info = `วัน${DAY_NAMES[sheetInfo.d]} คาบ ${sheetInfo.p} (${DATA.periods[sheetInfo.p].replace("-", "–")}) · ` + (c ? esc(c.join(" · ")) : "ว่าง");
    }
    return `<div class="sheet-head"><div><h3>${esc(roomTitle(r))}</h3><p class="sub">${esc(roomSub(r))}</p></div>
      <div class="acts"><button class="ibtn ${fav ? "on" : ""}" data-a="fav" data-id="${id}" aria-label="ห้องโปรด">${svg("star", "star")}</button>
      <button class="ibtn ${hid ? "on hd" : ""}" data-a="hide" data-id="${id}" aria-label="ซ่อนห้อง">${svg(hid ? "eyeoff" : "eye")}</button></div></div>
      <div class="card" style="margin-top:16px;padding:16px 14px 14px"><div class="wk">${hdr}${grid}</div>
      <div class="legend"><span><s class="f"></s>ว่าง</span><span><s></s>มีคนใช้</span>${ctx ? '<span style="color:var(--blue)">▭ ช่วงที่เลือก</span>' : ""}</div></div>
      <div class="info">${info}</div>
      ${skippedToday(id)
        ? `<button class="btn ghost block" data-a="unskip" data-id="${id}">ยกเลิกการข้ามห้องนี้</button>`
        : `<button class="btn ghost block" data-a="skip" data-id="${id}" ${ctx ? ctxAttr(ctx) : ""}>ห้องนี้ใช้ไม่ได้วันนี้</button>`}`;
  };
}

function editSheet(d, p) {
  return () => {
    const it = base(d, p) || null;            // แก้ตารางหลักเสมอ (การแก้เฉพาะวันนี้อยู่ส่วนบน)
    const t = bkk(), eff = mine(d, p), o = ovrToday(d);
    const todaySec = t.day !== d ? "" : `<div class="gh">แค่วันนี้</div><div class="group">
        ${o && o[p] !== undefined ? `<button class="row" data-a="todayClear" data-p="${p}"><div class="grow t n">ยกเลิกการแก้เฉพาะวันนี้</div></button>` : ""}
        <button class="row" data-a="todaySet" data-p="${p}" data-v="${eff ? 0 : 1}"><div class="grow t n">${eff ? "วันนี้คาบนี้ว่าง (ไม่มีเรียน)" : "วันนี้คาบนี้ไม่ว่าง"}</div></button></div>
      <p class="small" style="margin:8px 4px 0">มีผลเฉพาะวันนี้ พรุ่งนี้กลับเป็นตารางเดิม</p>
      <div class="gh" style="margin-top:26px">แก้ตารางหลัก</div>`;
    const opts = `<option value="">ไม่ระบุห้อง</option>` + ROOMS.map(r => `<option value="${r.id}" ${it && it.room === r.id ? "selected" : ""}>${esc(roomTitle(r))}</option>`).join("");
    return `<h3>วัน${DAY_NAMES[d]} · คาบ ${p}</h3><p class="sub">${DATA.periods[p].replace("-", "–")} น.</p>
      ${todaySec}
      <div class="group" style="margin-top:${todaySec ? 0 : 16}px"><label class="row"><div class="grow t n">มีเรียน / ไม่ว่าง</div>
        <span class="switch"><input type="checkbox" id="e-busy" data-c="ebusy" ${it ? "checked" : ""}><span></span></span></label></div>
      <div class="group ${it ? "" : "hide"}" id="e-fields">
        <label class="row"><span class="lbl">วิชา</span><input class="field" id="e-title" placeholder="เช่น ค31104" value="${esc(it && it.title)}"></label>
        <label class="row"><span class="lbl">ห้อง</span><select class="field" id="e-room" dir="rtl">${opts}</select></label>
        <label class="row"><span class="lbl">สถานที่อื่น</span><input class="field" id="e-place" placeholder="เช่น ยิม 2" value="${esc(it && it.place)}"></label>
      </div>
      <div class="btns"><button class="btn ghost" data-a="close">ยกเลิก</button><button class="btn" data-a="saveEdit" data-d="${d}" data-p="${p}">บันทึก</button></div>`;
  };
}

/* ---------- จัดการหน้าและเหตุการณ์ ---------- */
const TABS = [["search", "ห้องว่าง", searchView], ["now", "ตอนนี้", nowView], ["mine", "ตารางฉัน", mineView], ["settings", "ตั้งค่า", settingsView]];
let tab = (location.hash || "").slice(1);
if (!TABS.some(t => t[0] === tab)) tab = "search";

function render() {
  const y = window.scrollY;
  const view = $("#view");
  view.innerHTML = TABS.find(t => t[0] === tab)[2]();
  $("#tabs").innerHTML = TABS.map(([k, name]) => `<button class="tab ${k === tab ? "on" : ""}" data-a="tab" data-t="${k}">${svg(k)}<span>${name}</span></button>`).join("");
  renderSheet();
  window.scrollTo(0, y);
}
function go(t) {
  tab = t; history.replaceState(null, "", "#" + t);
  const v = $("#view"); v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
  render(); window.scrollTo(0, 0);
}
const toggle = (arr, id) => { const i = arr.indexOf(id); i < 0 ? arr.push(id) : arr.splice(i, 1); };

const ACTIONS = {
  tab: d => go(d.t),
  close: () => closeSheet(),
  room: d => { sheetInfo = null; openSheet(roomSheet(d.id, d.day !== undefined ? {day: +d.day, s: +d.s, e: +d.e} : null)); },
  cell: d => { sheetInfo = {d: +d.d, p: +d.p}; renderSheet(); },
  fav: d => { toggle(S.fav, d.id); save(); render(); },
  hide: d => { toggle(S.hide, d.id); save(); render(); },
  seeAll: d => { Q.day = +d.day; Q.a = +d.s; Q.b = +d.e; Q.mode = d.mode === "chain" ? "chain" : "one"; Q.more = false; go("search"); },
  mode: d => { Q.mode = d.v; Q.more = false; render(); },
  chainMore: () => { Q.more = true; render(); },
  chainMax: d => { S.chainMax = +d.n; save(); render(); },
  chainMin: d => { S.chainMin = +d.n; save(); render(); },
  chainStep: d => { S.chainStep = +d.n; save(); render(); },
  qday: d => { Q.day = +d.d; Q.more = false; render(); },
  per: d => {
    const p = +d.p;
    if (Q.a === Q.b && p !== Q.a) { Q.b = Math.max(Q.a, p); Q.a = Math.min(Q.a, p); }
    else { Q.a = Q.b = p; }
    Q.more = false; render();
  },
  span: d => { Q.a = +d.s; Q.b = +d.e; Q.more = false; render(); },
  edit: d => openSheet(editSheet(+d.d, +d.p)),
  saveEdit: d => {
    const day = +d.d, p = +d.p;
    S.my[day] = S.my[day] || {};
    if ($("#e-busy").checked) {
      const it = {title: $("#e-title").value.trim() || "ไม่ว่าง"};
      const room = $("#e-room").value, place = $("#e-place").value.trim();
      if (room) it.room = room;
      if (place) it.place = place;
      const old = S.my[day][p];
      if (old && old.teacher && old.title === it.title) it.teacher = old.teacher;
      S.my[day][p] = it;
    } else delete S.my[day][p];
    save(); closeSheet(); render();
  },
  resetMy: () => { if (confirm("คืนค่าตารางเป็นแบบตั้งต้น? ที่แก้ไว้จะหายไป")) { S.my = clone(DATA.timetable.busy); save(); render(); } },
  floor: d => { S.floor = d.f ? +d.f : null; save(); render(); },
  skip: d => skipRoom(d.id, d.day !== undefined ? +d.day : undefined, +d.s),
  unskip: d => { if (S.skip) S.skip.ids = S.skip.ids.filter(x => x !== d.id); save(); render(); },
  todaySet: d => {
    const p = +d.p, v = +d.v, prev = (ovrToday(bkk().day) || {})[p];
    setToday(p, v);
    toast(`วันนี้คาบ ${p} ${v ? "ไม่ว่าง" : "ว่าง"} (เฉพาะวันนี้)`, () => setToday(p, prev === undefined ? null : prev));
  },
  todayClear: d => setToday(+d.p, null),
  theme: d => { S.theme = d.v; save(); applyTheme(); render(); },
  rest: d => { toggle(S.rest, +d.p); save(); render(); },
  clearHist: () => { if (confirm("ล้างห้องที่ข้ามไว้วันนี้และประวัติ \"ใช้ไม่ได้\" ทั้งหมด?")) { S.hist = {}; S.skip = null; save(); render(); } },
  undo: () => { const f = lastUndo; lastUndo = null; hideToast(); if (f) f(); },
};

let lastUndo = null, toastTimer = null;
function toast(msg, undo) {
  lastUndo = undo || null;
  const el = $("#toast");
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-a="undo">เลิกทำ</button>' : ""}`;
  el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 6000);
}
function hideToast() { $("#toast").classList.remove("on"); }

function skipRoom(id, day, s) {                      // ห้องนี้ใช้ไม่ได้: ข้ามวันนี้ + จำไว้ลดอันดับช่วงเวลาเดิม
  const t = bkk();
  if (!S.skip || S.skip.date !== t.date) S.skip = {date: t.date, ids: []};
  if (!S.skip.ids.includes(id)) S.skip.ids.push(id);
  const key = day !== undefined && !isNaN(s) ? day + "-" + s : null;
  if (key) { const h = S.hist[id] = S.hist[id] || {}; h[key] = (h[key] || 0) + 1; }
  save(); closeSheet(); render();
  toast(`ข้าม ${roomTitle(R[id])} วันนี้แล้ว`, () => {
    if (S.skip) S.skip.ids = S.skip.ids.filter(x => x !== id);
    if (key && S.hist[id]) { if (--S.hist[id][key] <= 0) delete S.hist[id][key]; }
    save(); render();
  });
}
function setToday(p, v) {                            // v: 1 = ไม่ว่างวันนี้, 0 = ว่างวันนี้, null = ยกเลิก
  const t = bkk();
  if (!S.ovr || S.ovr.date !== t.date) S.ovr = {date: t.date, p: {}};
  if (v === null || (v === 1) === !!base(t.day, p)) delete S.ovr.p[p];   // เท่ากับตารางหลักก็ไม่ต้องจำ
  else S.ovr.p[p] = v;
  save(); closeSheet(); render();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (el && ACTIONS[el.dataset.a]) ACTIONS[el.dataset.a](el.dataset);
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-c]");
  if (!el) return;
  if (el.dataset.c === "smart") { S.smart = el.checked; save(); render(); }
  if (el.dataset.c === "chain") { S.chain = el.checked; save(); render(); }
  if (el.dataset.c === "lowfirst") { S.lowFirst = el.checked; save(); render(); }
  if (el.dataset.c === "ebusy") $("#e-fields").classList.toggle("hide", !el.checked);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
setInterval(() => { if (tab === "now" && !sheetFn && !bkk().fixed) render(); }, 30000);
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (sheetFn) return;
  if (Date.now() - hiddenAt > 120000) initQ();   // กลับมาหลังนาน: เลือกคาบปัจจุบันใหม่
  if (tab === "now" || tab === "search") render();
});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
</script>
